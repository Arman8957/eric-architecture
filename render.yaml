services:
  - type: web
    name: nestjs-backend
    env: node
    region: singapore
    plan: free

    buildCommand: |
      npm install
      npx prisma generate   # ← this is required!
      npx prisma migrate deploy
      npm run build

    startCommand: npm run start:prod

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
